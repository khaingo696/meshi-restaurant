<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <filter id="fiber" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" seed="7" result="fibers" stitchTiles="stitch" />
    <feColorMatrix in="fibers" type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.05 0.08 0.05 0" />
    </feComponentTransfer>
  </filter>
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.045 0.06 0.045 0" />
    </feComponentTransfer>
  </filter>
  <rect width="420" height="420" filter="url(#fiber)" />
  <rect width="420" height="420" filter="url(#grain)" />
</svg>
