<!doctype html>
<html lang="en" class="md-lock">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meshi - Door Intro Prototype</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="meshi-door/assets/meshi-door.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&family=Shippori+Mincho:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="meshi-door/door-intro.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Door intro overlay (meshi-door module, wired up in main.js). -->
    <div id="meshi-door" class="md-root is-loading"></div>
    <noscript
      ><style>
        #meshi-door {
          display: none;
        }
        html.md-lock {
          overflow: visible;
        }
      </style></noscript
    >

    <!-- Background video -->
    <video
      class="demo-room"
      crossorigin="anonymous"
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
      poster="https://meshi-restaurant.pages.dev/assets/hero-poster.webp"
      src="https://meshi-restaurant.pages.dev/assets/background_video.mp4"
    ></video>

    <header class="site-header">
      <a class="brand-mark" href="#" aria-label="Meshi">
        <img src="meshi-door/assets/meshi-logo.webp" alt="Meshi" width="593" height="421" />
      </a>
      <nav>
        <a href="#menu">Menu</a>
        <a href="#menu">Omakase</a>
        <a href="#menu">Reservations</a>
      </nav>
    </header>

    <main>
      <section class="hero" data-active-word="0">
        <!-- SVG filter for subtle organic heat/aroma wave on hover -->
        <svg class="sr-svg-defs" aria-hidden="true" width="0" height="0">
          <defs>
            <filter id="aroma-vapor" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.016 0.045" numOctaves="2" seed="3" result="noise">
                <animate attributeName="baseFrequency" values="0.016 0.045;0.022 0.065;0.016 0.045" dur="5.5s" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
        </svg>

        <div class="hero-stage">
          <div class="hero-copy">
            <!-- PURE DEPTH-OF-FIELD KICKER (Zero decorative lines):
                 1. Glides out from the Shoji door center seam as the door opens (--door-p: 0 -> 1)
                 2. Uses pure optical rack-focus (blur <-> crisp) across negative space so only the porcelain plate below has line art -->
            <div class="hero-kicker" role="group" aria-label="Taste, Feel, Connect">
              <button type="button" class="kicker-node" data-word="0">
                <span class="kicker-node-text">Taste</span>
              </button>

              <button type="button" class="kicker-node is-serif" data-word="1">
                <span class="kicker-node-text">Feel</span>
              </button>

              <button type="button" class="kicker-node" data-word="2">
                <span class="kicker-node-text">Connect</span>
              </button>
            </div>

            <!-- Headline with Editorial Deconstruction + Chopstick-Reactive Luxury Glass CTA -->
            <h1 class="hero-title" aria-label="A Taste of Home. On Your Plate">
              <span class="hero-title-line is-prelude">
                <span class="prelude-text">A Taste of Home.</span>
              </span>
              <span class="hero-title-line is-italic is-climax">
                <span class="on-your-text">On Your</span>
                <span class="plate-token">
                  <span class="plate-word-text">Plate</span>

                  <!-- Animated rising aroma/steam wisps anchored directly above the "a" of "Plate" -->
                  <svg class="plate-art-steam" viewBox="0 0 80 46" fill="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="steam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#ecd09c" stop-opacity="0.1" />
                        <stop offset="30%" stop-color="#f7efe2" stop-opacity="0.95" />
                        <stop offset="75%" stop-color="#ecd09c" stop-opacity="0.78" />
                        <stop offset="100%" stop-color="#ecd09c" stop-opacity="0" />
                      </linearGradient>
                    </defs>
                    <path
                      class="steam-wisp wisp-1"
                      d="M 22 44 C 15 34, 30 23, 21 12 C 16 6, 24 2, 20 -1"
                      stroke="url(#steam-grad)"
                      stroke-width="1.6"
                      stroke-linecap="round"
                    />
                    <path
                      class="steam-wisp wisp-2"
                      d="M 40 43 C 32 32, 50 20, 39 8 C 34 3, 42 0, 39 -3"
                      stroke="url(#steam-grad)"
                      stroke-width="1.85"
                      stroke-linecap="round"
                    />
                    <path
                      class="steam-wisp wisp-3"
                      d="M 58 44 C 51 34, 65 24, 56 13 C 51 7, 59 3, 55 0"
                      stroke="url(#steam-grad)"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    />
                  </svg>

                  <!-- Full shallow porcelain dish + foot ring (kodai) + reactive chopsticks beneath "Plate" -->
                  <svg class="plate-art-hashi" viewBox="0 0 210 40" fill="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="gold-fade" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ecd09c" stop-opacity="0.08" />
                        <stop offset="22%" stop-color="#ecd09c" stop-opacity="0.95" />
                        <stop offset="78%" stop-color="#ecd09c" stop-opacity="0.95" />
                        <stop offset="100%" stop-color="#ecd09c" stop-opacity="0.08" />
                      </linearGradient>
                    </defs>
                    <!-- Upper back rim of the plate -->
                    <path
                      class="dish-back-rim"
                      d="M 14 8 C 56 1, 138 1, 180 8"
                      stroke="rgba(236, 208, 156, 0.36)"
                      stroke-width="1"
                      stroke-linecap="round"
                    />
                    <!-- Front curved porcelain plate rim -->
                    <path
                      class="dish-front-rim"
                      d="M 6 9 C 44 27, 150 27, 188 9"
                      stroke="url(#gold-fade)"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                    <!-- Plate foot ring (kodai) -->
                    <path
                      class="dish-kodai"
                      d="M 58 24 C 82 29, 112 29, 136 24"
                      stroke="rgba(236, 208, 156, 0.65)"
                      stroke-width="1.15"
                      stroke-linecap="round"
                    />
                    <!-- Tapered Japanese chopsticks resting beneath the right rim (react when hovering Menu CTA) -->
                    <line
                      class="hashi-stick hashi-upper"
                      x1="40"
                      y1="34"
                      x2="204"
                      y2="22"
                      stroke="rgba(236, 208, 156, 0.85)"
                      stroke-width="1.3"
                      stroke-linecap="round"
                    />
                    <line
                      class="hashi-stick hashi-lower"
                      x1="56"
                      y1="38"
                      x2="206"
                      y2="27"
                      stroke="rgba(236, 208, 156, 0.55)"
                      stroke-width="1.05"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
              </span>
            </h1>

            <div class="hero-cta-wrap">
              <a class="hero-cta" href="#menu">
                <span class="hero-cta-gem" aria-hidden="true"></span>
                <span class="hero-cta-label">Prozkoumat menu</span>
                <span class="hero-cta-icon" aria-hidden="true">
                  <svg viewBox="0 0 22 10" fill="none">
                    <path d="M0 5H20M16 1L20 5L16 9" stroke="currentColor" stroke-width="1.2" />
                  </svg>
                </span>
              </a>
            </div>
          </div>

          <footer class="hero-meta" aria-label="Informace o restauraci">
            <a
              class="hero-rating"
              href="https://www.google.com/maps/search/?api=1&amp;query=Meshi%20n%C3%A1m.%20Republiky%20107%2F14%20Plze%C5%88"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Google hodnocení 4.9 z 5 restaurace Meshi Plzeň - otevřít na Google Maps"
            >
              <!-- Sculptural Editorial Score -->
              <span class="rating-monolith">
                <span class="rating-score">4.9</span>
                <span class="rating-scale" aria-hidden="true">/5</span>
              </span>

              <!-- 5-Node Golden Constellation + Kinetic Rolling Label -->
              <span class="rating-detail">
                <svg class="rating-constellation" viewBox="0 0 88 14" fill="none" aria-hidden="true">
                  <!-- Connecting golden constellation thread -->
                  <path
                    class="constellation-line"
                    d="M 7 9 L 25 5 L 44 8 L 63 4 L 81 7"
                    stroke="rgba(236, 208, 156, 0.38)"
                    stroke-width="0.85"
                    stroke-linecap="round"
                  />
                  <path
                    class="constellation-pulse"
                    d="M 7 9 L 25 5 L 44 8 L 63 4 L 81 7"
                    stroke="#fff6e0"
                    stroke-width="1.15"
                    stroke-linecap="round"
                  />
                  <!-- 5 Star Nodes -->
                  <g class="constellation-nodes" fill="#ecd09c">
                    <path class="c-node n-1" d="M7 5.2L8.1 7.9L10.8 9L8.1 10.1L7 12.8L5.9 10.1L3.2 9L5.9 7.9Z" />
                    <path class="c-node n-2" d="M25 1.2L26.1 3.9L28.8 5L26.1 6.1L25 8.8L23.9 6.1L21.2 5L23.9 3.9Z" />
                    <path class="c-node n-3" d="M44 4.2L45.1 6.9L47.8 8L45.1 9.1L44 11.8L42.9 9.1L40.2 8L42.9 6.9Z" />
                    <path class="c-node n-4" d="M63 0.2L64.1 2.9L66.8 4L64.1 5.1L63 7.8L61.9 5.1L59.2 4L61.9 2.9Z" />
                    <path class="c-node n-5" d="M81 3.2L82.1 5.9L84.8 7L82.1 8.1L81 10.8L79.9 8.1L77.2 7L79.9 5.9Z" />
                  </g>
                </svg>

                <span class="rating-reel">
                  <span class="reel-track">
                    <span class="reel-line">Google Reviews</span>
                    <span class="reel-line is-hover" aria-hidden="true">Plzeň · Mapa</span>
                  </span>
                  <span class="rating-arrow" aria-hidden="true">↗</span>
                </span>
              </span>
            </a>

            <div class="hero-hours">
              <span class="lantern-ember" aria-hidden="true">
                <span class="lantern-halo"></span>
                <span class="lantern-core"></span>
              </span>
              <span class="hours-text">
                <span class="hours-state">Otevřeno</span>
                <span class="hours-dot" aria-hidden="true">·</span>
                <span class="hours-time">zavíráme ve 23:00</span>
              </span>
            </div>
          </footer>
        </div>
      </section>

      <section class="menu" id="menu">
        <article>
          <div class="thumb"></div>
          <h3>Nigiri</h3>
          <p>Placeholder card.</p>
        </article>
        <article>
          <div class="thumb"></div>
          <h3>Sashimi</h3>
          <p>Placeholder card.</p>
        </article>
        <article>
          <div class="thumb"></div>
          <h3>Ramen</h3>
          <p>Placeholder card.</p>
        </article>
      </section>
    </main>

    <aside class="dev-controls" aria-label="Door intro developer controls">
      <button type="button" data-action="replay">Replay</button>
      <button type="button" data-action="open">Open</button>
      <button type="button" data-action="reset">Reset</button>
      <label><input type="checkbox" name="slow" /> Slow ×4</label>
      <output data-status></output>
    </aside>

    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
