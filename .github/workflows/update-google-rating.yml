name: Update Google rating

on:
  schedule:
    - cron: '0 5 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch rating
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node mockup/v9/fetch-google-rating.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mockup/v9/google-rating.json
          git diff --cached --quiet && echo "No rating change" && exit 0
          git commit -m "Update Google rating snapshot"
          git push
